<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Klasifikasi Kendaraan - Custom CNN</title>
    <!-- Memuat TensorFlow.js & TFLite Runtime -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.9/dist/tf-tflite.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 540px;
            padding: 32px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 6px 0;
            color: var(--text-main);
        }

        .header p {
            font-size: 0.875rem;
            color: var(--text-sub);
            margin: 0;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 9999px;
            margin-bottom: 20px;
            text-align: center;
            background-color: #fef3c7;
            color: #d97706;
        }

        .status-badge.ready {
            background-color: #dcfce7;
            color: #15803d;
        }

        .status-badge.error {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .dropzone {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            background-color: #f8fafc;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease;
            margin-bottom: 20px;
        }

        .dropzone:hover {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .dropzone input[type="file"] {
            display: none;
        }

        .preview-container {
            width: 100%;
            height: 220px;
            display: none;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 8px;
            background-color: #e2e8f0;
            margin-top: 12px;
        }

        .preview-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--primary-dark);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .results-section {
            margin-top: 28px;
            display: none;
        }

        .results-title {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-sub);
            margin-bottom: 12px;
        }

        .probability-bar {
            margin-bottom: 10px;
        }

        .bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .bar-track {
            height: 8px;
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background-color: #cbd5e1;
            width: 0%;
            transition: width 0.4s ease, background-color 0.4s ease;
            border-radius: 4px;
        }

        .probability-bar.top .bar-fill {
            background-color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1> Skenario Klasifikasi Kendaraan</h1>
            <p>Model Custom CNN • TFLite Web Inference Engine</p>
        </div>

        <div style="text-align: center;">
            <div id="statusBadge" class="status-badge">Memuat model TFLite...</div>
        </div>

        <div class="dropzone" onclick="document.getElementById('fileInput').click()">
            <span id="uploadPrompt" style="color: #64748b; font-size: 0.9rem;">Klik atau seret gambar ke sini untuk diunggah</span>
            <input type="file" id="fileInput" accept="image/*" onchange="handleImageUpload(event)">
            <div id="previewWrapper" class="preview-container">
                <img id="imagePreview" alt="Input Preview">
            </div>
        </div>

        <button id="predictBtn" class="btn" onclick="executeInference()" disabled>Jalankan Inferensi Model</button>

        <div id="resultsSection" class="results-section">
            <div class="results-title">Distribusi Probabilitas Prediksi</div>
            <div id="probabilitiesContainer"></div>
        </div>
    </div>

    <script>
        let tfliteModel = null;
        
        // PASTIKAN urutan array ini persis sama dengan alfabetis nama folder dataset Keras:
        // Cek via Colab: print(train_generator.class_indices)
        const CLASS_NAMES = ['Bicycle', 'Bus', 'Car', 'Motorcycle', 'Truck'];

        async function initModel() {
            const badge = document.getElementById('statusBadge');
            try {
                tflite.setWasmPath('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.9/dist/');
                tfliteModel = await tflite.loadTFLiteModel('model_kendaraan_lite.tflite');
                
                badge.innerText = "Model Siap Dipakai";
                badge.className = "status-badge ready";
            } catch (err) {
                console.error("Gagal memuat model TFLite:", err);
                badge.innerText = "Gagal Memuat Model (.tflite)";
                badge.className = "status-badge error";
            }
        }
        initModel();

        function handleImageUpload(evt) {
            const file = evt.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imgEl = document.getElementById('imagePreview');
                imgEl.src = e.target.result;
                document.getElementById('previewWrapper').style.display = 'flex';
                document.getElementById('uploadPrompt').style.display = 'none';
                
                if (tfliteModel) {
                    document.getElementById('predictBtn').removeAttribute('disabled');
                }
            };
            reader.readAsDataURL(file);
        }

        async function executeInference() {
            const imgElement = document.getElementById('imagePreview');
            if (!imgElement.src || !tfliteModel) return;

            const btn = document.getElementById('predictBtn');
            btn.disabled = true;
            btn.innerText = "Memproses Tensor...";

            // Menggunakan tf.tidy untuk mencegah kebocoran memori (memory leak) di browser
            tf.tidy(() => {
                // 1. Ambil 3 channel RGB (buang saluran Alpha jika PNG)
                let tensor = tf.browser.fromPixels(imgElement, 3);

                // 2. Preprocessing: Resize Bilinear ke (128, 128)
                tensor = tf.image.resizeBilinear(tensor, [128, 128]);

                // 3. Normalisasi piksel ke skala [0.0, 1.0]
                tensor = tensor.div(tf.scalar(255.0));

                // 4. Perluas dimensi batch [1, 128, 128, 3]
                tensor = tensor.expandDims(0);

                // 5. Jalankan inferensi TFLite
                const outputTensor = tfliteModel.predict(tensor);
                const predictions = outputTensor.dataSync(); // Ambil array data probabilitas

                renderProbabilities(Array.from(predictions));
            });

            btn.disabled = false;
            btn.innerText = "Jalankan Inferensi Model";
        }

        function renderProbabilities(probs) {
            const container = document.getElementById('probabilitiesContainer');
            container.innerHTML = '';
            document.getElementById('resultsSection').style.display = 'block';

            // Cari indeks tertinggi (Top Class)
            const maxVal = Math.max(...probs);
            const topIndex = probs.indexOf(maxVal);

            CLASS_NAMES.forEach((className, idx) => {
                const probPercent = (probs[idx] * 100).toFixed(2);
                const isTop = idx === topIndex;

                const barHTML = `
                    <div class="probability-bar ${isTop ? 'top' : ''}">
                        <div class="bar-label">
                            <span>${className} ${isTop ? '★' : ''}</span>
                            <span>${probPercent}%</span>
                        </div>
                        <div class="bar-track">
                            <div class="bar-fill" style="width: ${probPercent}%"></div>
                        </div>
                    </div>
                `;
                container.innerHTML += barHTML;
            });
        }
    </script>
</body>
</html>
